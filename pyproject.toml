[project]
name = "lawagent"
version = "0.1.0"
description = "Temporal Vietnamese labour-law RAG corpus tools"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
lawagent-parse = "lawagent.parser:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lawagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

